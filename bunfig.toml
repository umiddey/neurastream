# Supply-chain cooldown (SC-6): bun refuses to install any npm release
# younger than 7 days (604800 s), so a freshly hijacked release cannot
# reach `bun install` in CI, the publish job, or a local install.
[install]
minimumReleaseAge = 604800

# Tests never see the real queue (plan 20261031_0911 P3): every bun test run loads tests/preload.ts.
[test]
preload = ["./tests/preload.ts"]
