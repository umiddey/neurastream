:root {
  --paper:#F7F8FA; --card:#FFFFFF; --ink:#0B1220; --ink2:#1F2937; --body:#475569; --muted:#6B7280; --faint:#9CA3AF;
  --line:#E5E7EB; --soft:#F3F4F6; --accent:#4F46E5; --green:#059669; --red:#E11D48; --hl:#FDEBA0;
  --sans: "Inter", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--paper); color:var(--ink); font-family:var(--sans); font-feature-settings:"cv11"; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
#app { display:grid; grid-template-rows:auto 1fr auto; height:100vh; }
header { display:grid; grid-template-columns:minmax(280px,auto) 1fr; align-items:center; gap:40px; padding:18px 40px 6px; }
#deck { font-weight:600; font-size:15px; letter-spacing:-0.01em; color:var(--ink); }
#crumb { font-size:13px; color:var(--faint); margin-top:4px; white-space:nowrap; }
#crumb a { color:var(--accent); cursor:pointer; text-decoration:none; font-weight:500; }
#crumb a:hover { text-decoration:underline; text-underline-offset:3px; }
#mini { width:100%; height:52px; }
#mini .node { cursor:pointer; }
#stagewrap { position:relative; min-height:0; }
#stage { width:100%; height:100%; display:block; }
#stage .box { cursor:pointer; }
#stage .box .frame { transition:stroke .2s; }
#stage .box:hover .frame { stroke:#C7CCF5; }
svg text { white-space:pre; }
#stage, #mini { font-family:var(--sans); font-feature-settings:"cv11"; }
footer { padding:4px 44px 22px; }
#eyebrow { font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
#title { font-size:30px; font-weight:700; letter-spacing:-0.028em; line-height:1.15; margin:8px 0 0; color:var(--ink); }
#text { font-size:18.5px; line-height:1.5; color:var(--body); margin:6px 0 0; max-width:1180px; min-height:28px; letter-spacing:-0.005em; }
#note { display:inline-flex; align-items:center; gap:10px; margin-top:12px; font-size:15.5px; font-weight:500; color:#5B4708; background:#FFF8E1; border:1px solid #F7E3A1; border-radius:999px; padding:6px 16px 6px 12px; opacity:0; transform:translateY(6px); transition:opacity .45s cubic-bezier(.2,.7,.2,1), transform .45s cubic-bezier(.2,.7,.2,1); }
#note::before { content:""; width:7px; height:7px; border-radius:50%; background:#E0A800; flex:none; }
#note.on { opacity:1; transform:none; }
#bar { display:flex; align-items:center; gap:8px; margin-top:16px; }
button { font:inherit; font-size:14px; font-weight:500; height:36px; padding:0 14px; display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:#fff; color:var(--ink2); border-radius:10px; cursor:pointer; box-shadow:0 1px 2px rgba(16,24,40,.05); transition:border-color .15s, background .15s, box-shadow .15s; }
button svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; flex:none; }
button.icon { padding:0 11px; }
button:hover { border-color:#D1D5DB; background:#FAFAFB; }
button:focus-visible { outline:2px solid #A5B4FC; outline-offset:2px; }
button.primary { background:var(--ink); color:#fff; border-color:var(--ink); box-shadow:0 1px 2px rgba(16,24,40,.12), inset 0 1px 0 rgba(255,255,255,.08); }
button.primary:hover { background:#1F2937; }
button.on { background:#EEF0FF; border-color:#C7CCF5; color:var(--accent); }
.prog { display:flex; align-items:center; gap:3px; flex:1; margin:0 14px; }
.prog i { flex:1 1 0; height:4px; border-radius:2px; background:#E5E7EB; cursor:pointer; transition:background .25s, height .25s; }
.prog i:hover { background:var(--faint); }
.prog i.done { background:#A5ADBA; }
.prog i.cur { background:var(--accent); height:6px; border-radius:3px; }
.prog i.gap { margin-left:10px; }
#count { font-size:13px; font-weight:500; color:var(--faint); min-width:64px; text-align:right; font-variant-numeric:tabular-nums; }
@media (prefers-reduced-motion: reduce) { #note { transition:none; } }
</style>
</head>

<div id="app">
  <header>
    <div><div id="deck"></div><div id="crumb"></div></div>
    <svg id="mini" viewBox="0 0 1000 56" preserveAspectRatio="xMidYMid meet"></svg>
  </header>
  <div id="stagewrap">
    <svg id="stage" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid meet">
      <defs>

        <filter id="sh2" x="-20%" y="-30%" width="140%" height="190%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#101828" flood-opacity="0.08"/><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#101828" flood-opacity="0.10"/></filter>
        <pattern id="stripes" patternUnits="userSpaceOnUse" width="16" height="16"><rect width="16" height="16" fill="#fff"/><rect width="8" height="16" fill="#334155"/></pattern>

function mid(pts) {

}

/* forest token: the one moving thing on the map */

  const w = label ? textW(t) + 22 : 0;

async function along(tok, pts, speed = 1.1) {

  const ms = Math.max(450, total / speed);
  await tween(ms, (k) => {

    const f = segs[i] ? d / segs[i] : 0;
    tok.at(lerp(pts[i][0], pts[i + 1][0], f), lerp(pts[i][1], pts[i + 1][1], f));

}
function linkBetween(a, b) { return F.links.find((l) => l.from === a && l.to === b && !l.dashed); }
async function forestHop(a, b) {

}

/* ---------- action runner ---------- */
let REPLAYING = false;
async function runActions(list, at) { for (const act of list) await runAction(act, SCENES[at] || null, at); }

async function runAction(act, S, at) {
  if (act.parallel) { await Promise.all(act.parallel.map((lane) => runActions(lane, at))); return; }
  if (act.show !== undefined) { await Promise.all([].concat(act.show).map((id) => fade(need(S, 'show').actor(id).g, 1, 380))); return; }
  if (act.hide !== undefined) { await Promise.all([].concat(act.hide).map((id) => fade(need(S, 'hide').actor(id).g, 0, 300))); return; }
  if (act.call) { const [id, m, ...args] = act.call; const a = need(S, 'call').actor(id); if (typeof a[m] !== 'function') throw new Error(`${id} has no method ${m}`); await a[m](...args.map((x) => (typeof x === 'string' ? tone(x) : x))); return; }
  if (act.move !== undefined) { await movePacket(need(S, 'move'), act); return; }
  if (act.connect) { await connect(need(S, 'connect'), act); return; }
  if (act.unconnect) { const s = need(S, 'unconnect'); await fade(s.layerLinks, 0, 250); s.layerLinks.innerHTML = ''; s.layerLinks.setAttribute('opacity', 1); return; }
  if (act.mark) { await mark(need(S, 'mark').actor(act.mark[0]), act.mark[1]); return; }
  if (act.out !== undefined) { await need(S, 'out').setOut(act.out === true ? 'ok' : act.out); return; }
  if (act.lane) { await laneFlash(need(S, 'lane'), act.lane); return; }
  if (act.note !== undefined) { if (!REPLAYING) showNote(act.note); return; }
  if (act.wait) { await wait(act.wait); return; }
  if (act.mini) { if (!REPLAYING) await miniFlash(act.mini); return; }
  if (act.journey) { await journey(act.journey); return; }
  if (act.boxesIn) { await boxesIn(); return; }
  if (act.boxState) { setBoxState(act.boxState[0], act.boxState[1]); return; }
  if (act.line) { await recapLine(act.line[0], act.line[1] || []); return; }
  throw new Error('unknown action ' + JSON.stringify(act));
}
async function boxesIn() {

// Deck files may use plain hex colours; map them onto the palette.
const TONES = { '#16a34a': C.green, '#dc2626': C.red, '#f59e0b': C.amber, '#6b7280': C.muted, '#ca8a04': '#CA8A04', '#2563eb': C.blue, '#111': C.ink2, '#111111': C.ink2 };
function tone(c) { return (typeof c === 'string' && TONES[c.toLowerCase()]) || c; }
async function movePacket(S, act) {
  const color = tone(act.color || C.blue);

  const g = el('g', {}, S.layerFx);
  const t = T(g, 0, 6, act.move, { size: 15.5, mono: looksCode(act.move), weight: 600, anchor: 'middle', fill: '#fff', spacing: looksCode(act.move) ? undefined : '-0.1' });
  const w = textW(t) + 30;

  g.insertBefore(r, t);

      await tween(420, (k) => at(bx + Math.sin(k * Math.PI * 6) * 10, by));

    await tween(Math.max(380, L / 1.05), (k) => at(lerp(p.x, q.x, k), lerp(p.y, q.y, k)));
    if (act.stamp && act.stamp.at === i) {
      await wait(150);
      const sg = el('g', { transform: `translate(${w / 2 - 4},-30) rotate(-7)` }, g);
      const st = T(sg, 0, 5, act.stamp.text.toUpperCase(), { size: 12, weight: 700, fill: C.red, anchor: 'middle', spacing: '1.4' });
      const sw = textW(st) + 18;
      sg.insertBefore(el('rect', { x: -sw / 2, y: -13, width: sw, height: 26, rx: 7, fill: '#fff', stroke: C.red, 'stroke-width': 1.75 }), st);

}
async function connect(S, act) {

  path.removeAttribute('stroke-dasharray');
  if (act.label) {
    const t = eyebrow(S.layerLinks, (p.x + q.x) / 2 + 16, (p.y + q.y) / 2 + 5, act.label, { size: 11.5, fill: color === C.ink2 ? C.faint : color });

/* ---------- interior visibility + transitions ---------- */
function others(id) {
  const list = [F.linkG, F.box[id].num, F.box[id].r];
  for (const k in F.box) if (k !== id) list.push(F.box[k].g);
  return list;
}
function showInterior(at) {

  F.linkG.setAttribute('opacity', 1);
  for (const id in SCENES) {
    const s = SCENES[id], on = id === at;
    s.root.setAttribute('visibility', on ? 'visible' : 'hidden');
    s.root.setAttribute('opacity', on ? 1 : 0);
    F.box[id].face.setAttribute('opacity', on ? 0 : 1);
    F.box[id].num.setAttribute('opacity', 1);

}
async function zoomInto(id) {

  const face = F.box[id].face;
  const p1 = moveCam(camFor(id), 850);
  const p0 = Promise.all(others(id).map((e) => fade(e, 0, 600)));
  await wait(450);
  await Promise.all([p0, p1, fade(s.root, 1, 400), fade(face, 0, 300)]);
}

  else if (!isBox(b)) { await moveCam(camFor(b), 700); return; }
  if (isBox(a) && isBox(b)) await forestHop(a, b);
  if (isBox(b)) { if (!isBox(a) && a !== 'forest') await moveCam(camFor('forest'), 500); await zoomInto(b); }
}

/* ---------- UI ---------- */
const STEPS = ECO.steps;

function renderMini(at) {

async function miniFlash(id) {

async function go(n, animate = true) {

  freeLook = false;
  cur = n;
  buildWorld();
  INSTANT = true; REPLAYING = true;
  for (let i = 0; i < n; i++) { await runActions(STEPS[i].actions, STEPS[i].at); if (my !== GEN) return; }
  REPLAYING = false;
  const prev = n > 0 ? STEPS[n - 1].at : 'forest';
  renderChrome(n);
  if (!animate) {
    await runActions(STEPS[n].actions, STEPS[n].at);
    showInterior(STEPS[n].at); setCam(camFor(STEPS[n].at));
    INSTANT = false;

    return;
  }
  showInterior(prev); setCam(camFor(prev));
  INSTANT = false;
  await transition(prev, STEPS[n].at);
  if (my !== GEN) return;
  showInterior(STEPS[n].at);
  await runActions(STEPS[n].actions, STEPS[n].at);
  if (my !== GEN) return;
  if (STEPS[n].note) showNote(STEPS[n].note);

}

  $('title').textContent = 'Pick a box';
  $('text').textContent = 'Click any box to open it, or press Next to continue where you were.';

}
$('deck').textContent = ECO.title;
$('next').onclick = () => go(freeLook ? cur : cur + 1, true);
$('back').onclick = () => go(cur - 1, false);

Promise.all([document.fonts.load('600 20px Inter'), document.fonts.load('500 18px "JetBrains Mono"')]).catch(() => {}).then(() => {
