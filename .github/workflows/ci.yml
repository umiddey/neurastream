name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # The adapter tests run the real `omp plugin link` (no fake): install oh-my-pi.
      - run: bun add -g @oh-my-pi/pi-coding-agent@18.11.1 && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: omp --version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
