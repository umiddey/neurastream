# Publishes neurastream to the public npm registry on a v* tag via npm trusted
# publishing. The workflow's short-lived OIDC token authenticates the push.
# No NPM_TOKEN and no NODE_AUTH_TOKEN secret exists or is used.
#
# One-time bootstrap: npm only lets a package get a trusted publisher once the
# package exists. Publish 0.1.0 once by hand (owner `npm login`, then Main
# `npm publish --access public` from the verified tarball). Then the owner
# registers this workflow as a Trusted Publisher on npmjs.com: package
# neurastream → Settings → Trusted Publisher → umiddey/neurastream, workflow
# publish.yml. Every later v* tag publishes from Actions.
name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
      # Trusted publishing (OIDC-authenticated PUT) requires npm >= 11.5.
      - run: npm install -g npm@11.6.2
      # The adapter tests run the real `omp plugin link` (no fake): install oh-my-pi.
      - run: bun add -g @oh-my-pi/pi-coding-agent@18.11.1 && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: omp --version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: tag must equal v plus package.json version
        run: |
          ver="$(node -p "require('./package.json').version")"
          echo "tag=$GITHUB_REF_NAME version=v$ver"
          test "$GITHUB_REF_NAME" = "v$ver"
      # No --provenance: the repo is private and npm only accepts provenance
      # bundles from public source repos (E422). Trusted publishing (OIDC) still applies.
      - run: npm publish --access public
